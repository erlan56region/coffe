<!DOCTYPE html>
<html lang="ru" data-variant="v3">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>coffeeIT — Coffee First, Code Second</title>
<meta name="description" content="Нео-брутализм: молочный фон, брутальный шрифт, оранжевый акцент.">
<meta name="theme-color" content="#16130f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%2316130f'/%3E%3Cpath d='M14 18h16v10a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6V18Z' fill='none' stroke='%23f4efe4' stroke-width='2'/%3E%3Cpath d='M30 21h3a3.5 3.5 0 0 1 0 7h-3' fill='none' stroke='%23f4efe4' stroke-width='2'/%3E%3C/svg%3E">
<style>
/* ============ coffeeIT shared base ============ */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; overflow-x: hidden; }
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; }
input, textarea, select, button { font-family: inherit; }
:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
ul { margin: 0; padding: 0; list-style: none; }
h1, h2, h3, h4, p { margin: 0; }
.ic { display: inline-flex; width: 1em; height: 1em; }
.ic svg { width: 100%; height: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

.wrap { width: min(100% - 40px, var(--maxw, 1200px)); margin-inline: auto; }
.sec { padding: clamp(56px, 8vw, 120px) 0; position: relative; }
.page { display: none; }
.page.is-active { display: block; }

/* eyebrow + titles */
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
.h-xl { font-size: clamp(38px, 7vw, 84px); line-height: .98; letter-spacing: -.03em; }
.h-lg { font-size: clamp(28px, 4.4vw, 56px); line-height: 1.04; letter-spacing: -.02em; }
.h-md { font-size: clamp(22px, 2.6vw, 32px); line-height: 1.15; }
.lead { font-size: clamp(15px, 1.5vw, 19px); line-height: 1.6; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 24px;
  border: 0; border-radius: var(--r-btn, 999px); font-size: 15px; font-weight: 600; letter-spacing: .01em;
  background: var(--btn-bg); color: var(--btn-fg); transition: transform .18s, box-shadow .18s, background .18s; }
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0) scale(.99); }
.btn .ic { width: 18px; height: 18px; }
.btn-ghost { background: transparent; color: var(--btn-ghost-fg, inherit); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn-sm { padding: 10px 16px; font-size: 13.5px; }
.btn-full { width: 100%; }
.btn-accent { background: var(--accent); color: var(--accent-fg); }
.link-arrow { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.link-arrow .ic { width: 17px; height: 17px; transition: transform .2s; }
.link-arrow:hover .ic { transform: translateX(4px); }

/* grids */
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap, 24px); }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap, 24px); }
.sect-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; margin-bottom: clamp(24px, 4vw, 48px); flex-wrap: wrap; }
.sect-head .lead { max-width: 46ch; }

/* service cards */
.service-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap, 20px); }
.service-card { padding: clamp(20px, 2.4vw, 30px); display: flex; flex-direction: column; gap: 12px; position: relative; }
.service-card.is-wide { grid-column: span 1; }
.service-ico { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 14px;
  background: var(--tile); color: var(--tile-fg); font-size: 24px; }
.service-ico .ic { width: 24px; height: 24px; }
.service-card h3 { font-size: 19px; line-height: 1.25; }
.service-card p { font-size: 14.5px; line-height: 1.55; opacity: .82; }
.ticks { display: grid; gap: 6px; margin: 4px 0 8px; }
.ticks li { font-size: 13.5px; padding-left: 20px; position: relative; opacity: .9; }
.ticks li::before { content: ""; position: absolute; left: 0; top: .52em; width: 9px; height: 9px;
  border-radius: 3px; background: var(--accent); transform: rotate(45deg); }
.service-meta { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px;
  margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); opacity: .8; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.chip { padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line); background: transparent;
  color: inherit; font-size: 13.5px; transition: .18s; }
.chip.is-on { background: var(--accent); color: var(--accent-fg); border-color: transparent; }

/* cases */
.case-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap, 22px); }
.case { overflow: hidden; display: flex; flex-direction: column; }
.case-media { aspect-ratio: 4 / 3; background-size: cover; background-position: center; position: relative; }
.case-tag { position: absolute; left: 12px; top: 12px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  padding: 5px 10px; border-radius: 999px; background: var(--tag-bg); color: var(--tag-fg); }
.case-idx { position: absolute; right: 14px; bottom: 8px; font-size: 34px; font-weight: 700; opacity: .5; }
.case-body { padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.case-body h3 { font-size: 18px; line-height: 1.3; }
.case-body p { font-size: 14px; line-height: 1.5; opacity: .82; }
.case-metrics { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 4px; }
.metric b { display: block; font-size: 20px; }
.metric span { font-size: 11.5px; opacity: .7; }
.case-more { margin-top: auto; border-top: 1px solid var(--line); padding-top: 10px; }
.case-more summary { font-size: 13px; cursor: pointer; list-style: none; display: flex; align-items: center; gap: 6px; }
.case-more summary::-webkit-details-marker { display: none; }
.case-more summary::after { content: "+"; margin-left: auto; font-size: 16px; }
.case-more[open] summary::after { content: "–"; }
.case-more p { font-size: 13.5px; line-height: 1.55; opacity: .82; margin-top: 8px; }

/* vendors */
.vendor-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.vendor { padding: 20px 18px; border: 1px solid var(--line); border-radius: var(--r-card, 16px); display: grid; gap: 4px; }
.vendor b { font-size: 16px; }
.vendor span { font-size: 12.5px; opacity: .7; }

/* menu */
.menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 40px; }
.menu-item { padding: 14px 0; border-bottom: 1px dashed var(--line); }
.mi-top { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
.mi-top h4 { font-size: 16px; }
.mi-top b { font-size: 15px; white-space: nowrap; }
.menu-item p { font-size: 13px; opacity: .68; margin-top: 3px; }

/* zones */
.zone-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.zone { padding: 22px; border: 1px solid var(--line); border-radius: var(--r-card, 16px); display: grid; gap: 8px; align-content: start; }
.zone-ico { width: 38px; height: 38px; display: grid; place-items: center; font-size: 20px; border-radius: 12px; background: var(--tile); color: var(--tile-fg); }
.zone-ico .ic { width: 20px; height: 20px; }
.zone h4 { font-size: 16px; }
.zone p { font-size: 13.5px; line-height: 1.5; opacity: .78; }
.zone-price { font-size: 13px; margin-top: 4px; }

/* shop */
.product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap, 20px); }
.product { display: flex; flex-direction: column; overflow: hidden; }
.product-media { aspect-ratio: 1; background-size: cover; background-position: center; position: relative; display: grid; place-items: center; }
.product-ico { position: absolute; font-size: 76px; color: var(--art-fg); width: 76px; height: 76px; filter: drop-shadow(0 6px 18px rgba(0,0,0,.35)); }
.product-ico .ic, .product-ico svg { width: 100%; height: 100%; }
.product-ico.ic { display: block; }
.product-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.product-cat { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .6; }
.product-body h3 { font-size: 16px; line-height: 1.3; }
.product-note { font-size: 12.5px; opacity: .65; }
.product-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 8px; }
.product-foot b { font-size: 16px; }
.is-added { filter: brightness(1.1); }

/* cart drawer */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 90; backdrop-filter: blur(2px); }
.scrim.is-open { opacity: 1; pointer-events: auto; }
.cart-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); z-index: 100;
  background: var(--card); color: var(--fg); display: flex; flex-direction: column;
  transform: translateX(102%); transition: transform .32s cubic-bezier(.4,0,.2,1); box-shadow: -20px 0 60px rgba(0,0,0,.3); }
.cart-drawer.is-open { transform: none; }
.cart-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--line); }
.cart-head h3 { font-size: 18px; }
.icon-btn { background: transparent; border: 0; color: inherit; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; }
.icon-btn .ic { width: 20px; height: 20px; }
.cart-body { padding: 18px 20px 28px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; flex: 1; }
.cart-line { display: flex; align-items: center; gap: 12px; }
.cart-thumb { width: 54px; height: 54px; border-radius: 12px; background-size: cover; position: relative; flex: none; display: grid; place-items: center; color: var(--art-fg); }
.cart-thumb .ic { width: 26px; height: 26px; }
.cart-info { flex: 1; display: grid; gap: 2px; }
.cart-info b { font-size: 14px; font-weight: 600; }
.cart-info span { font-size: 12.5px; opacity: .65; }
.qty { display: flex; align-items: center; gap: 6px; }
.qty button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: inherit; display: grid; place-items: center; }
.qty button .ic { width: 14px; height: 14px; }
.qty span { min-width: 18px; text-align: center; font-size: 14px; }
.cart-total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 14px; border-top: 1px solid var(--line); }
.cart-total b { font-size: 20px; }
.cart-empty { text-align: center; display: grid; gap: 14px; justify-items: center; padding: 40px 10px; opacity: .9; }
.cart-empty > .ic { width: 52px; height: 52px; opacity: .5; }
.cart-empty p { font-size: 14px; line-height: 1.5; }
.cart-form { display: grid; gap: 10px; margin-top: 6px; }
.cart-form input, .cart-form textarea { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--input-bg, transparent); color: inherit; font-size: 14px; }
.cart-fab { position: fixed; right: 22px; bottom: 22px; z-index: 80; width: 58px; height: 58px; border-radius: 50%;
  border: 0; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center;
  box-shadow: 0 14px 34px rgba(0,0,0,.28); transition: transform .2s; }
.cart-fab:hover { transform: translateY(-3px) scale(1.03); }
.cart-fab .ic { width: 24px; height: 24px; }
.badge { position: absolute; top: -4px; right: -4px; min-width: 22px; height: 22px; border-radius: 999px;
  background: var(--card); color: var(--fg); border: 1px solid var(--line); font-size: 11.5px; display: grid; place-items: center; font-weight: 700; }
.badge.is-empty { opacity: 0; }

/* forms */
.form-note { font-size: 12px; opacity: .6; line-height: 1.45; }
.form-ok { font-size: 13px; color: var(--accent); }
.lead-form { display: grid; gap: 12px; }
.lead-form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.lead-form input, .lead-form textarea, .lead-form select { width: 100%; padding: 13px 15px; border-radius: var(--r-input, 12px);
  border: 1px solid var(--line); background: var(--input-bg, transparent); color: inherit; font-size: 14.5px; }
.lead-form textarea { resize: vertical; }

/* toast */
.toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 24px); z-index: 200;
  padding: 12px 20px; border-radius: 999px; background: var(--fg); color: var(--bg); font-size: 13.5px;
  opacity: 0; transition: .28s; pointer-events: none; }
.toast.is-on { opacity: 1; transform: translate(-50%, 0); }

/* reveal */
.rv { opacity: 0; transform: translateY(18px); transition: opacity .6s, transform .6s; }
.rv.is-in { opacity: 1; transform: none; }

/* mobile menu default (skins restyle) */
.burger { display: none; }
.mobile-menu { display: none; }

/* ---- responsive ---- */
@media (max-width: 1080px) {
  .service-grid, .case-grid, .product-grid { grid-template-columns: repeat(2, 1fr); }
  .vendor-grid, .zone-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 760px) {
  .wrap { width: min(100% - 28px, var(--maxw, 1200px)); }
  .grid-2, .grid-3, .service-grid, .case-grid, .product-grid, .menu-grid, .vendor-grid, .zone-grid { grid-template-columns: 1fr; }
  .lead-form .row { grid-template-columns: 1fr; }
  .cart-fab { right: 14px; bottom: 14px; }
  .toast { bottom: 88px; width: max-content; max-width: calc(100% - 32px); }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001s !important; transition-duration: .001s !important; }
  .rv { opacity: 1; transform: none; }
}

/* фото-баннер на странице мерча */
.ci-banner{aspect-ratio:21/6;background-size:cover;background-position:center;margin-bottom:26px;
  border-radius:var(--r-card,0);box-shadow:0 18px 40px rgba(0,0,0,.12)}
@media (max-width:760px){.ci-banner{aspect-ratio:16/9;margin-bottom:18px}}
/* мягкая засветка медиа-подложек товаров */
.product-media::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.10),transparent 55%,rgba(0,0,0,.35));pointer-events:none}

/* coffeeIT — вариант 3 «COFFEE FIRST» · нео-брутализм */
body[data-variant="v3"]{
  background:var(--bg);color:var(--fg);
  font-family:"Arial Black","Arial Bold",Gadget,sans-serif;
  -webkit-font-smoothing:antialiased;--ink:var(--fg);
}
body[data-variant="v3"] p,body[data-variant="v3"] li,body[data-variant="v3"] span,body[data-variant="v3"] input,
body[data-variant="v3"] textarea,body[data-variant="v3"] select,body[data-variant="v3"] .btn,
body[data-variant="v3"] summary{font-family:"Trebuchet MS",Verdana,Tahoma,sans-serif;letter-spacing:0}
body[data-variant="v3"] h1,body[data-variant="v3"] h2,body[data-variant="v3"] h3,body[data-variant="v3"] h4,body[data-variant="v3"] .btn{
  font-family:"Arial Black","Arial Bold",Gadget,sans-serif;letter-spacing:-.03em;text-transform:none}
body[data-variant="v3"] .btn{text-transform:uppercase;letter-spacing:.02em;font-size:13.5px}

/* header */
.v3-head{position:sticky;top:0;z-index:60;background:var(--bg);border-bottom:3px solid var(--fg)}
.v3-head .wrap{display:flex;align-items:center;gap:16px;height:78px}
.v3-logo{display:flex;align-items:center;gap:10px;margin-right:auto}
.v3-logo .box{background:var(--accent);border:3px solid var(--fg);width:44px;height:44px;display:grid;place-items:center;transform:rotate(-4deg)}
.v3-logo .box .ic{width:24px;height:24px;color:var(--fg)}
.v3-logo b{font-size:24px;letter-spacing:-.05em;text-transform:lowercase}
.v3-logo b em{font-style:normal;background:var(--fg);color:var(--bg);padding:0 4px}
.v3-nav{display:flex;gap:6px;flex-wrap:wrap}
.v3-nav a{font-family:"Trebuchet MS",sans-serif;font-size:13.5px;font-weight:700;padding:8px 12px;border:2px solid transparent;transition:.15s}
.v3-nav a:hover{border-color:var(--fg)}
.v3-nav a.is-on{background:var(--fg);color:var(--bg)}
.v3-actions{display:flex;align-items:center;gap:8px}
.v3-cart{position:relative;width:44px;height:44px;border:3px solid var(--fg);background:var(--bg);display:grid;place-items:center;color:var(--fg)}
.v3-cart .ic{width:20px;height:20px}
.v3-cart .badge{background:var(--accent);color:var(--fg);border:2px solid var(--fg)}
.v3-actions .btn{border:3px solid var(--fg);box-shadow:4px 4px 0 var(--fg);padding:10px 16px}
.v3-actions .btn:hover{box-shadow:1px 1px 0 var(--fg);transform:translate(3px,3px)}
.burger{display:none;width:44px;height:44px;border:3px solid var(--fg);background:var(--bg);align-items:center;justify-content:center;flex-direction:column;gap:4px;color:var(--fg)}
.burger i{width:18px;height:3px;background:currentColor}
.mobile-menu{display:none;position:fixed;inset:78px 0 0;background:var(--bg);z-index:55;padding:18px;flex-direction:column;gap:8px;border-top:3px solid var(--fg)}
body.menu-open .mobile-menu{display:flex}
.mobile-menu a{font-family:"Arial Black",sans-serif;font-size:22px;padding:12px;border:3px solid var(--fg);background:#fff}
.mobile-menu a.is-on{background:var(--fg);color:var(--bg)}

/* hero */
.v3-hero{padding:clamp(26px,4vw,52px) 0;position:relative;overflow:hidden}
.v3-hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(18px,3vw,36px);align-items:center}
.v3-sticker{display:inline-block;background:var(--accent);border:3px solid var(--fg);padding:7px 14px;font-family:"Trebuchet MS",sans-serif;
  font-weight:700;font-size:13px;transform:rotate(-2deg);box-shadow:4px 4px 0 var(--fg);margin-bottom:18px}
.v3-hero h1{font-size:clamp(38px,7vw,88px);line-height:.92;letter-spacing:-.05em}
.v3-hero h1 mark{background:var(--fg);color:var(--bg);padding:0 8px;display:inline-block;transform:rotate(-1deg)}
.v3-hero h1 u{text-decoration:none;border-bottom:8px solid var(--accent);padding-bottom:2px}
.v3-hero .lead{margin-top:20px;max-width:44ch;font-size:16px;line-height:1.5;font-weight:600}
.v3-hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.v3-hero-cta .btn{padding:14px 24px;font-size:14px;border:3px solid var(--fg);box-shadow:5px 5px 0 var(--fg)}
.v3-hero-cta .btn-ghost{background:#fff;color:var(--fg)}
.v3-hero-cta .btn:hover{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--fg)}
.v3-art{position:relative}
.v3-art .frame{border:3px solid var(--fg);background:#fff;padding:8px;box-shadow:8px 8px 0 var(--fg);transform:rotate(1.5deg)}
.v3-art .frame .ph{aspect-ratio:1/1.08;background-size:cover;background-position:center}
.v3-art .cup-big{position:absolute;right:-14px;bottom:-18px;width:112px;height:112px;background:var(--accent);border:3px solid var(--fg);
  border-radius:50%;display:grid;place-items:center;box-shadow:5px 5px 0 var(--fg);animation:v3bob 4s ease-in-out infinite}
.v3-art .cup-big .ic{width:56px;height:56px;color:var(--fg)}
@keyframes v3bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-8px) rotate(4deg)}}
.v3-marq{background:var(--fg);color:var(--bg);border-block:3px solid var(--fg);overflow:hidden;padding:10px 0}
.v3-marq .t{display:flex;gap:26px;width:max-content;animation:v3t 22s linear infinite;font-family:"Arial Black",sans-serif;
  font-size:15px;text-transform:uppercase;letter-spacing:.02em}
.v3-marq .t span{display:flex;align-items:center;gap:26px}
.v3-marq .t span::after{content:"★";color:var(--accent);font-size:12px}
@keyframes v3t{to{transform:translateX(-50%)}}

/* section shells */
.v3-sec{padding:clamp(44px,6vw,88px) 0}
.v3-shead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:clamp(22px,3vw,38px);flex-wrap:wrap}
.v3-shead h2{font-size:clamp(28px,4.4vw,54px);line-height:.94;letter-spacing:-.045em}
.v3-shead h2 .hl{background:var(--accent);border:3px solid var(--fg);padding:0 8px;display:inline-block;transform:rotate(-1deg)}
.v3-shead p{max-width:40ch;font-size:14.5px;line-height:1.55;font-weight:600}

/* cards hard shadow */
.v3 .service-card,.service-card{border-radius:0}
.v3-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.v3-card,.v3-grid3 .service-card{background:#fff;border:3px solid var(--fg);box-shadow:6px 6px 0 var(--fg);padding:20px;display:flex;flex-direction:column;gap:10px;transition:.16s}
.v3-card:hover,.v3-grid3 .service-card:hover{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--fg)}
.v3-card .service-ico,.v3-grid3 .service-card .service-ico,.v3-card .zone-ico{background:var(--accent);border:3px solid var(--fg);border-radius:0;color:var(--fg);width:44px;height:44px}
.v3-card h3,.v3-grid3 .service-card h3{font-size:18px;line-height:1.1}
.v3-card p,.v3-grid3 .service-card p{font-size:13.5px;line-height:1.45}
.v3-ticks li{font-size:12.5px;font-weight:700}
.v3-ticks li::before{background:var(--fg);border-radius:0;width:8px;height:8px}
.v3-card .service-meta,.v3-grid3 .service-card .service-meta{border-top:2px dashed var(--fg);font-weight:700;font-size:12px}
.v3-card .link-arrow,.v3-grid3 .service-card .link-arrow{background:var(--fg);color:var(--bg);padding:9px 14px;width:max-content;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em}
.v3-card .link-arrow .ic{color:var(--accent)}

/* cases */

.case{border:3px solid var(--fg);box-shadow:6px 6px 0 var(--fg);background:#fff;border-radius:0;transition:.16s}
.case:hover{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--fg)}
.case-media{border-bottom:3px solid var(--fg)}
.case-tag{background:var(--accent);color:var(--fg);border:2px solid var(--fg);border-radius:0;font-weight:700}
.case-idx{font-family:"Arial Black",sans-serif;color:#fff;opacity:.9;text-shadow:2px 2px 0 var(--fg)}
.v3-case-grid .metric b{font-family:"Arial Black",sans-serif;font-size:19px;color:var(--fg)}
.case-more{border-top:2px dashed var(--fg)}
.case-body p{font-weight:600}
.chip{border:3px solid var(--fg);border-radius:0;font-weight:700;background:#fff;color:var(--fg)}
.chip.is-on{background:var(--accent);color:var(--fg);border-color:var(--fg);box-shadow:3px 3px 0 var(--fg)}

/* steps as numbers */
.v3-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.v3-step{border:3px solid var(--fg);background:#fff;padding:16px;display:grid;gap:8px;box-shadow:5px 5px 0 var(--fg)}
.v3-step b{font-family:"Arial Black",sans-serif;font-size:34px;line-height:1;color:var(--accent);-webkit-text-stroke:2px var(--fg)}
.v3-step h4{font-size:15px}
.v3-step p{font-size:13px;line-height:1.45;font-weight:600}

/* space / menu */
.v3-space{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.v3-panel{background:#fff;border:3px solid var(--fg);box-shadow:6px 6px 0 var(--fg);padding:clamp(16px,2.4vw,26px)}
.v3-panel.dark{background:var(--fg);color:var(--bg)}
.v3-panel.dark .mi-top b{color:var(--accent)}
.v3-panel.dark .menu-item{border-bottom:2px dashed rgba(255,255,255,.3)}
.v3-panel h3{font-size:clamp(19px,2.2vw,26px);margin-bottom:12px}
.v3-panel .menu-grid{grid-template-columns:1fr;gap:0}
.v3-panel .menu-item{padding:10px 0;border-bottom:2px dashed var(--fg)}
.v3-panel .mi-top h4{font-family:"Trebuchet MS",sans-serif;font-weight:700;font-size:15px}
.v3-panel .mi-top b{font-family:"Arial Black",sans-serif;font-size:14px}
.v3-panel .menu-item p{font-size:12.5px;opacity:.75;font-weight:600}
.v3-panel .zone-grid{grid-template-columns:1fr 1fr;gap:12px}
.v3-panel .zone{border:3px solid var(--fg);border-radius:0;padding:14px;box-shadow:4px 4px 0 var(--accent)}
.v3-panel .zone h4{font-family:"Arial Black",sans-serif;font-size:14px}
.v3-panel .zone p{font-size:12.5px;font-weight:600}

/* vendors */
.v3-vendors{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.v3-vendors .vendor{border:3px solid var(--fg);background:#fff;border-radius:0;box-shadow:4px 4px 0 var(--fg);
  transform:rotate(var(--rot,0deg));transition:.16s}
.v3-vendors .vendor:hover{transform:rotate(0) translate(2px,2px);box-shadow:1px 1px 0 var(--fg);background:var(--accent)}
.v3-vendors .vendor b{font-family:"Arial Black",sans-serif;font-size:15px}
.v3-vendors .vendor span{font-weight:600;opacity:.85}

/* shop */
.v3-shopbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.product-grid{gap:18px}
.product{border:3px solid var(--fg);box-shadow:6px 6px 0 var(--fg);background:#fff;border-radius:0;transition:.16s}
.product:hover{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--fg)}
.product-media{border-bottom:3px solid var(--fg)}
.product-ico{color:#fff;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.55))}
.product-body h3{font-family:"Arial Black",sans-serif;font-size:14.5px;line-height:1.2}
.product-foot b{font-family:"Arial Black",sans-serif;font-size:17px}
.product-foot .btn{border:3px solid var(--fg);border-radius:0;box-shadow:3px 3px 0 var(--fg);padding:8px 12px;font-size:11.5px}
.product-foot .btn:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--fg)}
.product-cat{font-family:"Trebuchet MS",sans-serif;font-weight:700;background:var(--fg);color:var(--bg);padding:3px 7px;width:max-content;font-size:10px}
.product-note{font-weight:600}

/* cta */
.v3-cta{background:var(--accent);border-block:3px solid var(--fg);padding:clamp(34px,5vw,64px) 0;position:relative;overflow:hidden}
.v3-cta .wrap{display:grid;grid-template-columns:1.2fr .8fr;gap:26px;align-items:center;position:relative}
.v3-cta h2{font-size:clamp(28px,4.2vw,52px);line-height:.95;letter-spacing:-.045em}
.v3-cta p{margin-top:12px;font-size:15px;font-weight:600;max-width:40ch;line-height:1.5}
.v3-cta .btn{background:var(--fg);color:var(--bg);border:3px solid var(--fg);box-shadow:5px 5px 0 #fff}
.v3-sub{background:#fff;border:3px solid var(--fg);box-shadow:6px 6px 0 var(--fg);padding:18px;display:grid;gap:8px}
.v3-sub input{padding:12px;border:3px solid var(--fg);background:#fff;font-size:14px}
.v3-sub .btn{margin-top:2px}

/* forms */
.v3-formcard{background:#fff;border:3px solid var(--fg);box-shadow:6px 6px 0 var(--fg);padding:clamp(16px,2.4vw,26px)}
.v3-formcard h3{font-size:21px;margin-bottom:6px}
.v3-formcard p{font-size:13.5px;font-weight:600;margin-bottom:14px}
.v3-formcard input,.v3-formcard textarea,.v3-formcard select{border:3px solid var(--fg);border-radius:0;background:#fff;color:var(--fg);padding:12px}
.v3-formcard .btn{border-radius:0;border:3px solid var(--fg);box-shadow:4px 4px 0 var(--fg)}
.v3-formcard .btn:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--fg)}
.v3-crows{display:grid;gap:12px;margin-bottom:18px}
.v3-crows li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:#fff;border:3px solid var(--fg);
  box-shadow:4px 4px 0 var(--fg);padding:13px 15px}
.v3-crows .ic{width:22px;height:22px}
.v3-crows b{display:block;font-family:"Arial Black",sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.v3-crows span{font-size:13.5px;font-weight:600}
.v3-map{border:3px solid var(--fg);background:repeating-linear-gradient(45deg,#fff 0 14px,var(--bg) 14px 28px);
  height:160px;display:grid;place-items:center;font-weight:700;font-size:13px;text-align:center;box-shadow:6px 6px 0 var(--fg)}
.v3-page-hero{padding:clamp(26px,4vw,54px) 0 clamp(14px,2vw,24px)}
.v3-page-hero h1{font-size:clamp(32px,5.6vw,72px);line-height:.92;letter-spacing:-.05em}
.v3-page-hero p{margin-top:16px;max-width:52ch;font-size:15px;line-height:1.55;font-weight:600}
.v3-contacts{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}

/* squiggle divider */
.v3-squig{height:24px;background-repeat:repeat-x;background-size:48px 24px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='24'><path d='M0 12 Q12 0 24 12 T48 12' fill='none' stroke='%231b1410' stroke-width='3'/></svg>")}

@media (max-width:1080px){
  .v3-nav{display:none}.burger{display:flex}
  .v3-hero .wrap{grid-template-columns:1fr}
  .v3-art{order:-1;max-width:440px;margin:0 auto 10px}
  .v3-grid3{grid-template-columns:repeat(2,1fr)}
  .case-grid{grid-template-columns:repeat(2,1fr)}
  .v3-steps{grid-template-columns:1fr 1fr}
  .v3-space,.v3-contacts,.v3-cta .wrap{grid-template-columns:1fr}
  .v3-vendors{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:760px){
  .v3-head .wrap{height:66px}.mobile-menu{inset:66px 0 0}
  .v3-actions .btn{display:none}
  .v3-grid3,.v3-vendors,.v3-panel .zone-grid{grid-template-columns:1fr 1fr}
  .case-grid{grid-template-columns:1fr 1fr}
  .v3-steps{grid-template-columns:1fr}
  .v3-hero h1{font-size:clamp(34px,10vw,52px)}
  .v3-art .cup-big{width:82px;height:82px;right:-6px;bottom:-10px}
  .v3-art .cup-big .ic{width:40px;height:40px}
  .product-grid{grid-template-columns:1fr 1fr;gap:12px}
  .product-body{padding:12px}
  .product-note{display:none}
  .product-foot{flex-direction:column;align-items:stretch}
  .product-foot .btn{width:100%}
  .v3-panel .zone-grid{grid-template-columns:1fr}
}
@media (max-width:420px){
  .v3-grid3,.product-grid,.case-grid{grid-template-columns:1fr}
}

.v3-grid3 .service-card .ticks li{font-size:12.5px;font-weight:700}
.v3-grid3 .service-card .ticks li::before{background:#1b1410;border-radius:0;width:8px;height:8px}
.case-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:1080px){.case-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){.case-grid{grid-template-columns:1fr 1fr}}
@media (max-width:420px){.case-grid{grid-template-columns:1fr}}

/* case cards brutal (все страницы) */
.case{border:3px solid #1b1410;box-shadow:6px 6px 0 #1b1410;background:#fff;border-radius:0;transition:.16s}
.case:hover{transform:translate(3px,3px);box-shadow:2px 2px 0 #1b1410}
.case .case-media{border-bottom:3px solid #1b1410}
.case .case-tag{background:#ff7a29;color:#1b1410;border:2px solid #1b1410;border-radius:0;font-weight:700;font-family:"Trebuchet MS",sans-serif}
.case .case-idx{font-family:"Arial Black",sans-serif;color:#fff;opacity:.95;text-shadow:2px 2px 0 #1b1410}
.case .metric b{font-family:"Arial Black",sans-serif;font-size:19px}
.case .case-more{border-top:2px dashed #1b1410}
.case .case-body p{font-weight:600}

/* зоны на странице «Пространство» — 2×2, крупнее */
.v3-zones{display:block}
.v3-zones .zone-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:26px}
.v3-zones .zone{background:#fff;border:3px solid #1b1410;box-shadow:5px 5px 0 #1b1410;border-radius:0;padding:18px}
.v3-zones .zone-ico{background:#ff7a29;border:3px solid #1b1410;border-radius:0;color:#1b1410}
.v3-zones .zone h4{font-family:"Arial Black",sans-serif;font-size:15px}
.v3-zones .zone p{font-size:13px;font-weight:600;line-height:1.45}
.v3-zones .zone-price{font-family:"Arial Black",sans-serif;font-size:12.5px;background:#1b1410;color:#f3ece0;padding:4px 8px;width:max-content}
@media (max-width:1080px){.v3-zones .zone-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.v3-zones .zone-grid{grid-template-columns:minmax(0,1fr)}}

    if (!opt.noChips) {
      var tags = ['Все'];
      CFG.cases.forEach(function (c) { if (tags.indexOf(c.tag) < 0) tags.push(c.tag); });
      chips = '<div class="chips" data-cases-filter>' + tags.map(function (t, i) {
        return '<button class="chip' + (i === 0 ? ' is-on' : '') + '" data-tag="' + t + '">' + t + '</button>';
      }).join('') + '</div>';
    }
    var cards = list.map(function (c, i) {
      return '<article class="case rv" data-tag="' + c.tag + '">' +
        '<div class="case-media" style="background-image:url(' + raster(101 + i * 37, 640, 460) + ')">' +
        '<span class="case-tag">' + c.tag + '</span><span class="case-idx">0' + (i + 1) + '</span></div>' +
        '<div class="case-body"><h3>' + c.title + '</h3><p>' + c.text + '</p>' +
        '<div class="case-metrics">' + c.metrics.map(function (m) {
          return '<div class="metric"><b>' + m[0] + '</b><span>' + m[1] + '</span></div>';
        }).join('') + '</div>' +
        '<details class="case-more"><summary>' + CFG.labels.readMore + '</summary><p>' + c.details + '</p></details>' +
        '</div></article>';
    }).join('');
    return chips + '<div class="case-grid">' + cards + '</div>';
  }

  function vendorsGrid() {
    return CFG.vendors.map(function (v) {
      return '<div class="vendor"><b>' + v[0] + '</b><span>' + v[1] + '</span></div>';
    }).join('');
  }

  function menuList() {
    return '<div class="menu-grid">' + CFG.menu.map(function (m) {
      return '<div class="menu-item"><div class="mi-top"><h4>' + m[0] + '</h4><b>' + m[1] + '</b></div><p>' + m[2] + '</p></div>';
    }).join('') + '</div>';
  }

  function zonesGrid() {
    return '<div class="zone-grid">' + CFG.zones.map(function (z) {
      return '<div class="zone"><div class="zone-ico">' + ic(z.icon) + '</div><h4>' + z.title + '</h4><p>' + z.text + '</p>' +
        '<span class="zone-price">' + z.price + '</span></div>';
    }).join('') + '</div>';
  }

  function productCard(p) {
    return '<article class="product rv" data-cat="' + p.cat + '">' +
      '<div class="product-media" style="background-image:url(' + productImg(p) + ')">' + ic(p.icon, 'product-ico') + '</div>' +
      '<div class="product-body"><span class="product-cat">' + CATNAMES[p.cat] + '</span><h3>' + p.title + '</h3>' +
      (p.note ? '<p class="product-note">' + p.note + '</p>' : '') +
      '<div class="product-foot"><b>' + p.price.toLocaleString('ru-RU') + ' ₽</b>' +
      '<button class="btn btn-sm" data-add="' + p.id + '">В корзину</button></div></div></article>';
  }

  function shopGrid(opt) {
    opt = opt || {};
    var list = opt.limit ? products.slice(0, opt.limit) : products;
    var chips = '';
    if (!opt.noChips) {
      var cats = ['all'].concat(Object.keys(CATNAMES).filter(function (c) {
        return products.some(function (p) { return p.cat === c; });
      }));
      chips = '<div class="chips" data-shop-filter>' + cats.map(function (c, i) {
        return '<button class="chip' + (i === 0 ? ' is-on' : '') + '" data-cat="' + c + '">' + (c === 'all' ? 'Всё' : CATNAMES[c]) + '</button>';
      }).join('') + '</div>';
    }
    return chips + '<div class="product-grid">' + list.map(productCard).join('') + '</div>';
  }

  function contactsRows() {
    return (C.rows || []).map(function (r) {
      return '<li>' + ic(r[0]) + '<div><b>' + r[1] + '</b><span>' + r[2] + '</span></div></li>';
    }).join('');
  }

  function cartMarkup() {
    return '<div class="scrim" id="scrim" data-cart-close></div>' +
      '<aside class="cart-drawer" id="cartDrawer" aria-label="Корзина">' +
      '<header class="cart-head"><h3>' + (CFG.cartTitle || 'Корзина') + '</h3><button class="icon-btn" data-cart-close aria-label="Закрыть">' + ic('close') + '</button></header>' +
      '<div class="cart-body" id="cartBody"></div></aside>' +
      '<button class="cart-fab" id="cartFab" data-cart-open aria-label="Открыть корзину">' + ic('cart') +
      '<span class="badge" id="cartBadge">0</span></button>';
  }

  /* ---------- cart state ---------- */
  var cart = [];
  try { cart = JSON.parse(localStorage.getItem('ci_cart_' + CFG.id) || '[]'); } catch (e) { cart = []; }
  function count() { return cart.reduce(function (a, b) { return a + b.qty; }, 0); }
  function total() { return cart.reduce(function (a, b) { return a + b.qty * b.price; }, 0); }
  function saveCart() {
    try { localStorage.setItem('ci_cart_' + CFG.id, JSON.stringify(cart)); } catch (e) {}
    renderCart();
  }
  function renderCart() {
    $$('#cartBadge').forEach(function (b) { b.textContent = count(); b.classList.toggle('is-empty', count() === 0); });
    var body = $('#cartBody');
    if (!body) return;
    if (!cart.length) {
      body.innerHTML = '<div class="cart-empty">' + ic('cart') + '<p>Корзина пуста. Мерч coffeeIT ждёт вас — кружки, худи и стикеры уже на витрине.</p>' +
        '<a class="btn btn-ghost" href="#shop" data-nav="shop">В магазин</a></div>';
      return;
    }
    var p = function (id) { return products.filter(function (x) { return x.id === id; })[0] || {}; };
    body.innerHTML = cart.map(function (l) {
      var pr = p(l.id);
      return '<div class="cart-line"><div class="cart-thumb" style="background-image:url(' + (pr.id ? productImg(pr, 160) : '') + ')">' + ic(l.icon) + '</div>' +
        '<div class="cart-info"><b>' + l.title + '</b><span>' + l.price.toLocaleString('ru-RU') + ' ₽ / шт</span></div>' +
        '<div class="qty"><button data-dec="' + l.id + '" aria-label="Меньше">' + ic('minus') + '</button><span>' + l.qty + '</span>' +
        '<button data-inc="' + l.id + '" aria-label="Больше">' + ic('plus') + '</button></div></div>';
    }).join('') +
      '<div class="cart-total"><span>Итого</span><b>' + total().toLocaleString('ru-RU') + ' ₽</b></div>' +
      '<form class="cart-form" id="cartForm"><input name="name" required placeholder="Имя" autocomplete="name">' +
      '<input name="phone" required placeholder="Телефон или @telegram" autocomplete="tel">' +
      '<textarea name="comment" rows="2" placeholder="Комментарий к заказу (необязательно)"></textarea>' +
      '<button class="btn btn-full" type="submit">Оформить заказ</button>' +
      '<p class="form-note">Итог заказа откроется в почтовом приложении — останется нажать «Отправить».</p></form>';
  }

  /* ---------- toast ---------- */
  var toastEl, toastT;
  function toast(msg) {
    if (!toastEl) { toastEl = document.createElement('div'); toastEl.className = 'toast'; document.body.appendChild(toastEl); }
    toastEl.textContent = msg;
    toastEl.classList.add('is-on');
    clearTimeout(toastT);
    toastT = setTimeout(function () { toastEl.classList.remove('is-on'); }, 2600);
  }
  window.CI_TOAST = toast;

  /* ---------- interactions ---------- */
  document.addEventListener('click', function (e) {
    var add = e.target.closest('[data-add]');
    if (add) {
      var id = add.getAttribute('data-add');
      var pr = products.filter(function (x) { return x.id === id; })[0];
      var line = cart.filter(function (x) { return x.id === id; })[0];
      if (line) line.qty++;
      else cart.push({ id: id, title: pr.title, price: pr.price, qty: 1, icon: pr.icon });
      saveCart();
      toast('«' + pr.title + '» в корзине');
      var old = add.textContent;
      add.textContent = 'Добавлено ✓';
      setTimeout(function () { add.textContent = old; }, 1200);
      return;
    }
    var t;
    if ((t = e.target.closest('[data-inc]'))) { cart.forEach(function (l) { if (l.id === t.getAttribute('data-inc')) l.qty++; }); saveCart(); return; }
    if ((t = e.target.closest('[data-dec]'))) {
      var did = t.getAttribute('data-dec');
      cart.forEach(function (l) { if (l.id === did) l.qty--; });
      cart = cart.filter(function (l) { return l.qty > 0; }); saveCart(); return;
    }
    if (e.target.closest('[data-cart-open]')) { openCart(true); return; }
    if (e.target.closest('[data-cart-close]')) { openCart(false); return; }

    /* tabs */
    if ((t = e.target.closest('[data-tab]'))) {
      var box = t.closest('[data-tabs]') || document;
      var key = t.getAttribute('data-tab');
      $$('[data-tab]', box).forEach(function (b) { b.classList.toggle('is-on', b === t); });
      $$('[data-panel]', box).forEach(function (p) { p.classList.toggle('is-on', p.getAttribute('data-panel') === key); });
      return;
    }

    /* filters */
    if ((t = e.target.closest('[data-tag]'))) {
      var wrap = t.closest('[data-cases-filter]');
      $$('.chip', wrap).forEach(function (c) { c.classList.toggle('is-on', c === t); });
      var tag = t.getAttribute('data-tag');
      $$('.case').forEach(function (c) {
        c.style.display = (tag === 'Все' || c.getAttribute('data-tag') === tag) ? '' : 'none';
      });
      return;
    }
    if ((t = e.target.closest('[data-cat]'))) {
      var w2 = t.closest('[data-shop-filter]');
      $$('.chip', w2).forEach(function (c) { c.classList.toggle('is-on', c === t); });
      var cat = t.getAttribute('data-cat');
      $$('.product').forEach(function (p) {
        p.style.display = (cat === 'all' || p.getAttribute('data-cat') === cat) ? '' : 'none';
      });
      return;
    }

    /* CTA → mail */
    var cta = e.target.closest('[data-cta]');
    if (cta && !cta.hasAttribute('href')) {
      e.preventDefault();
      var kind = cta.getAttribute('data-cta');
      var topic = cta.getAttribute('data-topic') || (CFG.ctaTopics || {})[kind] || '';
      window.location.href = mailto((CFG.subjectPrefix || 'coffeeIT —') + ' ' + topic,
        'Здравствуйте!\n\nХочу обсудить: ' + topic + '.\n\nЗадача: \nСроки: \nБюджет: ');
      toast('Открываем почту для заявки');
      return;
    }

    /* menu */
    if (e.target.closest('#burger')) {
      var on = document.body.classList.toggle('menu-open');
      var b = $('#burger'); if (b) b.setAttribute('aria-expanded', on ? 'true' : 'false');
      return;
    }
    if (e.target.closest('.mobile-menu a')) {
      document.body.classList.remove('menu-open');
      var b2 = $('#burger'); if (b2) b2.setAttribute('aria-expanded', 'false');
    }
  });

  function openCart(on) {
    var d = $('#cartDrawer'), ov = $('#scrim');
    if (!d) return;
    d.classList.toggle('is-open', on);
    if (ov) ov.classList.toggle('is-open', on);
    document.body.classList.toggle('cart-open', on);
  }

  /* ---------- forms ---------- */
  document.addEventListener('submit', function (e) {
    var f = e.target;
    if (f.id === 'cartForm') {
      e.preventDefault();
      var d = new FormData(f);
      var lines = cart.map(function (l) {
        return '• ' + l.title + ' × ' + l.qty + ' = ' + (l.price * l.qty).toLocaleString('ru-RU') + ' ₽';
      }).join('\n');
      window.location.href = mailto('coffeeIT — заказ мерча',
        'Заказ мерча coffeeIT\n\n' + lines + '\n\nИтого: ' + total().toLocaleString('ru-RU') + ' ₽\n\n' +
        'Имя: ' + (d.get('name') || '') + '\nКонтакт: ' + (d.get('phone') || '') + '\nКомментарий: ' + (d.get('comment') || '—') + '\n');
      toast('Заказ готов к отправке');
      return;
    }
    if (f.classList.contains('js-lead')) {
      e.preventDefault();
      var dd = new FormData(f);
      var body = 'Здравствуйте!\n\n';
      [['name', 'Имя'], ['contact', 'Контакт'], ['topic', 'Интересует'], ['message', 'Задача'], ['date', 'Дата'], ['time', 'Время'], ['zone', 'Зона'], ['people', 'Человек']].forEach(function (k) {
        if (dd.get(k[0])) body += k[1] + ': ' + dd.get(k[0]) + '\n';
      });
      window.location.href = mailto((CFG.subjectPrefix || 'coffeeIT —') + ' ' + (dd.get('topic') || 'заявка'), body);
      var ok = f.querySelector('.form-ok'); if (ok) ok.hidden = false;
      toast('Заявка готова к отправке');
      return;
    }
    if (f.classList.contains('js-book')) {
      e.preventDefault();
      var b = new FormData(f);
      var rows = [['name', 'Имя'], ['contact', 'Контакт'], ['date', 'Дата'], ['time', 'Время'], ['zone', 'Зона'], ['people', 'Человек']]
        .map(function (k) { return k[1] + ': ' + (b.get(k[0]) || '—'); }).join('\n');
      window.location.href = mailto('coffeeIT — бронирование места', 'Здравствуйте!\n\nХочу забронировать место.\n\n' + rows + '\n');
      var ok2 = f.querySelector('.form-ok'); if (ok2) ok2.hidden = false;
      toast('Бронь готова к отправке');
      return;
    }
    if (f.classList.contains('js-news')) {
      e.preventDefault();
      toast('Подписка оформлена — до встречи в coffeeIT ☕');
      f.reset();
    }
  });

  /* ---------- reveal + counters ---------- */
  var io;
  function revealInit() {
    if (!('IntersectionObserver' in window)) { $$('.rv').forEach(function (el) { el.classList.add('is-in'); }); return; }
    if (!io) {
      io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('is-in'); io.unobserve(en.target); } });
      }, { threshold: 0.1, rootMargin: '0px 0px -6% 0px' });
    }
    $$('.rv:not(.is-in)').forEach(function (el) { io.observe(el); });
  }
  function counters() {
    $$('[data-count]').forEach(function (el) {
      var target = parseFloat(el.getAttribute('data-count'));
      if (isNaN(target) || el.dataset.done) return;
      el.dataset.done = '1';
      var suf = el.getAttribute('data-suffix') || '';
      var dec = (el.getAttribute('data-dec') || '0') === '1';
      var t0 = performance.now(), dur = 1500;
      function step(t) {
        var k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3), v = target * e;
        el.textContent = (dec ? v.toFixed(1) : Math.round(v)) + suf;
        if (k < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }

  /* ---------- router ---------- */
  var PAGES = NAV.map(function (n) { return n[0]; });
  function route() {
    var id = (location.hash || '#home').replace('#', '');
    if (PAGES.indexOf(id) < 0) id = 'home';
    if (!$('#page-' + id)) id = 'home';
    $$('.page').forEach(function (p) { p.classList.toggle('is-active', p.id === 'page-' + id); });
    $$('[data-nav]').forEach(function (a) { a.classList.toggle('is-on', a.getAttribute('data-nav') === id); });
    document.body.setAttribute('data-page', id);
    document.body.classList.remove('menu-open');
    window.scrollTo(0, 0);
    revealInit();
    setTimeout(counters, 120);
  }
  window.addEventListener('hashchange', route);

  /* ---------- boot ---------- */
  function boot() {
    var H = {
      ic: ic, raster: raster, cfg: CFG, data: CFG, contacts: C, mail: mail,
      navHtml: navHtml(),
      servicesHtml: servicesCards(),
      servicesRows: servicesCards(),
      serviceRowsAll: servicesCards(),
      casesHtml: casesGrid(),
      casesHome: casesGrid({ noChips: true, limit: 3 }),
      vendorsHtml: vendorsGrid(),
      vendorsTable: '<table class="v4-table"><thead><tr><th>Вендор</th><th>Направление</th><th>Статус</th></tr></thead><tbody>' +
        CFG.vendors.map(function (v) { return '<tr><td>' + v[0] + '</td><td>' + v[1] + '</td><td>партнёр</td></tr>'; }).join('') +
        '</tbody></table>',
      cartCount: String(count()),
      v4tabs: (function () {
        function sp(i) { var s = CFG.services[i]; return s ? '<h3>' + s.title + '</h3><p>' + s.text + '</p><ul class="ticks">' +
          s.list.map(function (l) { return '<li>' + l + '</li>'; }).join('') + '</ul>' : ''; }
        var quotes = CFG.services.map(function (s, i) {
          return '<button class="' + (i === 0 ? 'is-on' : '') + '" data-tab="s' + i + '">' + s.title.split(' ')[0].replace('ПО', 'ПО') + '</button>';
        }).join('');
        var labels = ['develop', 'hardware', 'infosec', 'integrations', 'support'];
        var tabs = CFG.services.map(function (s, i) {
          return '<button class="' + (i === 0 ? 'is-on' : '') + '" data-tab="s' + i + '"><span class="c">0' + (i + 1) + '</span> ' + s.title + '</button>';
        }).join('');
        var panels = CFG.services.map(function (s, i) {
          return '<div class="v4-tabpanel' + (i === 0 ? ' is-on' : '') + '" data-panel="s' + i + '">' + sp(i) +
            '<div class="v4-tabmeta"><span class="dim">price</span> <span class="c">' + s.price + '</span>' +
            '<span class="dim">eta</span> <span>' + s.time + '</span>' +
            '<a class="link-arrow" href="#contacts" data-cta="service" data-topic="' + s.title + '">отправить заявку →</a></div></div>';
        }).join('');
        return '<div class="v4-tabs" data-tabs><div class="v4-tablist">' + tabs + '</div>' + panels + '</div>';
      })(),
      menuHtml: menuList(),
      zonesHtml: zonesGrid(),
      shopHtml: '<div class="ci-banner" style="background-image:url(' + ((window.CI_PHOTOS || {}).merch || raster(51, 820, 400)) + ')"></div>' + shopGrid(),
      shopPreview: shopGrid({ noChips: true, limit: 4 }),
      contactsHtml: contactsRows(),
      brands: CFG.vendors.slice(0, 8).map(function (v) { return '<span>' + v[0] + '</span>'; }).join(''),
      cart: cartMarkup(),
      heroArt: (window.CI_PHOTOS || {}).hero || raster((CFG.art || {}).heroSeed || 7, 900, 1100),
      sceneArt: (window.CI_PHOTOS || {}).space || raster((CFG.art || {}).sceneSeed || 21, 1000, 760),
      merchArt: (window.CI_PHOTOS || {}).merch || raster((CFG.art || {}).sceneSeed || 33, 820, 400)
    };
    var html = CFG.layout(H);
    html = html.replace(/\{\{(\w+)(?::(\w+))?\}\}/g, function (m, k, arg) {
      if (k === 'ic') return ic(arg || 'bean');
      if (typeof H[k] === 'string') return H[k];
      return m;
    });
    $('#app').innerHTML = html;
    if (CFG.cartSlot) {
      var cslot = $('#cartSlot');
      if (cslot) cslot.outerHTML = cartMarkup();
    }
    renderCart();
    route();
    window.addEventListener('scroll', function () {
      document.body.classList.toggle('is-scrolled', window.scrollY > 20);
    }, { passive: true });
    $$('[data-raster]').forEach(function (el) {
      el.style.backgroundImage = 'url(' + raster(parseInt(el.getAttribute('data-raster'), 10) || 5, 640, 640) + ')';
    });
    document.body.classList.add('is-ready');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
